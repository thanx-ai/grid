name: Self-test

# This repo's own CI — runs on every PR and push to master against
# thanx-ai/grid-tooling itself. Doesn't touch any external Windmill workspace.
#
# What this proves:
#   - The reusable workflow YAML is well-formed (actionlint).
#   - Every shell script under scripts/ (incl. scripts/test/) parses
#     (bash -n) and has no shellcheck errors.
#   - Offline behavioral tests under scripts/test/ pass (e.g. the
#     list-grid-items.sh inventory + dependency-ordering test, which builds
#     a throwaway git repo — no Windmill workspace involved).
#
# What this does NOT prove (deferred to integration test against
# thanx-ai/grid-shared):
#   - The reusable workflows actually deploy items end-to-end.
#   - The scripts work against a live Windmill workspace.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax check
        run: |
          # nullglob so an empty scripts/test/ yields no args rather than a
          # literal "scripts/test/*.sh" path that bash -n would choke on.
          shopt -s nullglob
          fail=0
          for f in scripts/*.sh scripts/test/*.sh; do
            echo "▶ bash -n $f"
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/test/*.sh)
          shellcheck "${files[@]}"

  script-tests:
    name: script-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run offline script tests
        run: |
          shopt -s nullglob
          tests=(scripts/test/*-test.sh)
          # Fail loud if the suite vanished — a silently-empty test job
          # would look green while proving nothing.
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "ERROR: no tests found under scripts/test/ (expected *-test.sh)" >&2
            exit 1
          fi
          fail=0
          for t in "${tests[@]}"; do
            echo "▶ $t"
            bash "$t" || fail=1
          done
          exit $fail
