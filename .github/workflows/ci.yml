name: Grid CI (reusable)

# Reusable workflow consumed by project repos via:
#
#   jobs:
#     ci:
#       uses: thanx-ai/grid-tooling/.github/workflows/ci.yml@master
#       secrets:
#         WMILL_READ_TOKEN: ${{ secrets.WMILL_READ_TOKEN }}
#
# Runs five checks on the caller's repo:
#   1. `wmill app lint` on every f/**/<name>.raw_app/, treating esbuild
#      warnings as errors.
#   2. `bun test` inside every f/**/<name>.raw_app/ that ships *_test.ts.
#      Raw-app code cannot be covered by the `// test:` deploy tests — those
#      execute on Windmill, where the ./wmill virtual module does not exist —
#      so without this, app logic has no automated check at all.
#   3. Verifies every literal wmill.getVariable("f/...") and
#      wmill.getResource("f/...") path resolves in the prod workspace.
#   4. Verifies every f/**/folder.meta.yaml's extra_perms only references
#      known groups for the target workspace — catches a wrong-case or
#      made-up group name (e.g. g/Operations instead of g/operations)
#      before merge. See claude/rules/folder-perms.md. Static/offline —
#      cannot catch a canonical-but-nonexistent group.
#   5. Verifies every group/user referenced in a f/**/folder.meta.yaml
#      actually exists in the live target workspace — the check that (4)
#      structurally cannot do. Requires WMILL_READ_TOKEN; passes with a
#      warning if absent, same as check (3).

on:
  workflow_call:
    inputs:
      wmill_version:
        type: string
        default: "1.700.1"
        description: windmill-cli version to install.
      bun_version:
        type: string
        default: "1.3.13"
        description: bun version used to run raw-app tests. Pinned so CI matches laptops.
      base_url:
        type: string
        default: "https://grid-origin.thanx.com"
        description: Windmill API base URL (direct origin bypasses Cloudflare).
      workspace:
        type: string
        default: "thanx"
        description: Target Windmill workspace name. Must match the deploy.yml workspace input for this caller.
    secrets:
      WMILL_READ_TOKEN:
        required: false
        description: Token with variables:read + resources:read + groups:read + users:read. Without it, the variable-reference and live-group checks pass with a warning.

jobs:
  lint-raw-apps:
    name: Lint raw apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        # ref: master is required. github.job_workflow_sha empirically
        # evaluates to empty for external callers, which makes
        # actions/checkout fall back to a `GET /repos/{owner}/{repo}`
        # default-branch lookup that the caller's GITHUB_TOKEN cannot
        # perform against this private repo (the org-level reusable-workflow
        # access setting authorizes the YAML *load* and git-protocol fetch
        # but not the REST metadata call). Hardcoded `master` matches the
        # "ship on master" policy in CLAUDE.md / DEVELOPING.md.
        # See claude/rules/reusable-workflow-meta-checkout.md.
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wmill CLI
        run: npm install -g windmill-cli@${{ inputs.wmill_version }}

      - name: Lint every .raw_app/ (warnings-as-errors)
        run: bash .grid-meta/scripts/lint-raw-apps.sh

  test-raw-apps:
    name: Test raw apps
    runs-on: ubuntu-latest
    # No secrets, so this runs on fork PRs too — app logic is exactly the kind
    # of change an outside contributor is most likely to get subtly wrong.
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        # ref: master — same constraint as the lint job above.
        # See claude/rules/reusable-workflow-meta-checkout.md.
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      # npm for dependency install (package-lock.json is what the repo commits),
      # bun to run the tests — the same runtime Windmill uses for these apps.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Deliberately NOT oven-sh/setup-bun: bun ships on npm, so this needs no
      # third-party action, and it matches how this file already installs the
      # wmill CLI. Whether the org allows actions outside actions/* is not
      # readable without admin, and a CI job is a bad place to find out.
      - name: Install bun
        run: npm install -g bun@${{ inputs.bun_version }}

      - name: Run every .raw_app/'s bun tests
        run: bash .grid-meta/scripts/test-raw-apps.sh

  check-variable-references:
    name: Check getVariable / getResource references resolve
    runs-on: ubuntu-latest
    # Skip on PRs from forks — no access to the read token.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      WMILL_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      - name: Verify referenced variables / resources exist in prod
        env:
          WMILL_READ_TOKEN: ${{ secrets.WMILL_READ_TOKEN }}
        run: bash .grid-meta/scripts/check-variable-references.sh

  check-folder-perms:
    name: Check folder.meta.yaml ACLs
    runs-on: ubuntu-latest
    # Purely static — no workspace token needed, so this runs on fork PRs too.
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      - name: Verify folder.meta.yaml extra_perms reference known groups
        run: bash .grid-meta/scripts/check-folder-perms.sh "${{ inputs.workspace }}"

  check-folder-groups-live:
    name: Check folder.meta.yaml groups/users exist in the live workspace
    runs-on: ubuntu-latest
    # Skip on PRs from forks — no access to the read token.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      WMILL_BASE_URL: ${{ inputs.base_url }}
      WMILL_WORKSPACE: ${{ inputs.workspace }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid-tooling (for shared scripts)
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid-tooling
          ref: master
          path: .grid-meta

      - name: Verify referenced groups/users exist in the live workspace
        env:
          WMILL_READ_TOKEN: ${{ secrets.WMILL_READ_TOKEN }}
        run: bash .grid-meta/scripts/check-folder-groups-live.sh
