name: Grid CI (reusable)

# Reusable workflow consumed by project repos via:
#
#   jobs:
#     ci:
#       uses: thanx-ai/grid/.github/workflows/ci.yml@master
#       secrets:
#         WMILL_READ_TOKEN: ${{ secrets.WMILL_READ_TOKEN }}
#
# Runs two checks on the caller's repo:
#   1. `wmill app lint` on every f/**/<name>.raw_app/, treating esbuild
#      warnings as errors.
#   2. Verifies every literal wmill.getVariable("f/...") and
#      wmill.getResource("f/...") path resolves in the prod workspace.

on:
  workflow_call:
    inputs:
      wmill_version:
        type: string
        default: "1.700.1"
        description: windmill-cli version to install.
      base_url:
        type: string
        default: "https://grid-origin.thanx.com"
        description: Windmill API base URL (direct origin bypasses Cloudflare).
    secrets:
      WMILL_READ_TOKEN:
        required: false
        description: Token with variables:read + resources:read. Without it, the variable-reference check passes with a warning.

jobs:
  lint-raw-apps:
    name: Lint raw apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid (for shared scripts)
        # github.job_workflow_sha is the resolved SHA of THIS reusable workflow
        # file, regardless of how the caller pinned it (tag, branch, SHA). It
        # works for every caller; GITHUB_WORKFLOW_REF points at the caller's
        # trigger ref (refs/pull/N/merge, refs/heads/master) which doesn't
        # exist in this repo. See claude/rules/reusable-workflow-meta-checkout.md.
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid
          ref: ${{ github.job_workflow_sha }}
          path: .grid-meta

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wmill CLI
        run: npm install -g windmill-cli@${{ inputs.wmill_version }}

      - name: Lint every .raw_app/ (warnings-as-errors)
        run: bash .grid-meta/scripts/lint-raw-apps.sh

  check-variable-references:
    name: Check getVariable / getResource references resolve
    runs-on: ubuntu-latest
    # Skip on PRs from forks — no access to the read token.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      WMILL_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout thanx-ai/grid (for shared scripts)
        uses: actions/checkout@v6
        with:
          repository: thanx-ai/grid
          ref: ${{ github.job_workflow_sha }}
          path: .grid-meta

      - name: Verify referenced variables / resources exist in prod
        env:
          WMILL_READ_TOKEN: ${{ secrets.WMILL_READ_TOKEN }}
        run: bash .grid-meta/scripts/check-variable-references.sh
